name: ETL Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"   # Also runs daily at 06:00 UTC in CI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run pipeline end-to-end
        run: python pipeline.py

      - name: Verify database was created
        run: |
          python - <<'EOF'
          import sqlite3
          from pathlib import Path
          db = Path("sales_pipeline.db")
          assert db.exists(), "Database file not created"
          with sqlite3.connect(db) as conn:
              tables = [r[0] for r in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              ).fetchall()]
              for t in ["fact_orders","dim_products","dim_regions","agg_monthly","gap_analysis"]:
                  assert t in tables, f"Missing table: {t}"
          print("✅ All tables verified")
          EOF

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
